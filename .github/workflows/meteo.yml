name: Meteo Update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run script
        env:
          METEO_API_KEY: ${{ secrets.METEO_API_KEY }}
        run: python script.py

      - name: Commit CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add meteo.csv
          git commit -m "Update meteo data" || echo "No changes"
          git pull --rebase
          git push
